<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equalization Rocks! · Audio Effects Chain in Your Browser</title>
  <meta name="description" content="Load a song and build an audio effects chain in your browser. Stack EQ, compression, delay, reverb, distortion, gating, and panning, and hear each change live.">
  <meta name="author" content="Leo Herzog">
  <link rel="author" href="https://herzog.tech/">
  <link rel="canonical" href="https://equalization.rocks/">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Equalization Rocks!">
  <meta property="og:title" content="Equalization Rocks!">
  <meta property="og:description" content="Load a song and build an audio effects chain in your browser. Stack EQ, compression, delay, reverb, distortion, gating, and panning, and hear each change live.">
  <meta property="og:url" content="https://equalization.rocks/">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://equalization.rocks/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Equalization Rocks! logo, a speech bubble holding a music note, beside a nine-band graphic equalizer">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Equalization Rocks!",
    "url": "https://equalization.rocks/",
    "description": "Load a song and build an audio effects chain in your browser. Stack EQ, compression, delay, reverb, distortion, gating, and panning, and hear each change live.",
    "image": "https://equalization.rocks/assets/og-image.png",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires the Web Audio API",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Leo Herzog", "url": "https://herzog.tech/" }
  }
  </script>

  <script src="https://kit.webawesome.com/c091c003930a4b78.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <wa-page>
    <header slot="header">
      <span class="wa-heading-xl"><wa-icon name="message-music"></wa-icon> Equalization Rocks!</span>
      <wa-dropdown id="theme-dropdown">
        <wa-button slot="trigger" appearance="plain">
          <wa-icon id="theme-icon" name="circle-half-stroke"></wa-icon>
        </wa-button>
        <wa-dropdown-item value="auto">
          <wa-icon slot="icon" name="circle-half-stroke"></wa-icon>
          Auto
        </wa-dropdown-item>
        <wa-dropdown-item value="light">
          <wa-icon slot="icon" name="sun-bright"></wa-icon>
          Light
        </wa-dropdown-item>
        <wa-dropdown-item value="dark">
          <wa-icon slot="icon" name="moon"></wa-icon>
          Dark
        </wa-dropdown-item>
      </wa-dropdown>
    </header>

    <wa-tab-group id="tabs">
      <wa-tab slot="nav" panel="signal-chain">
        <wa-icon slot="start" name="diagram-project"></wa-icon>
        Signal Chain
      </wa-tab>

      <wa-tab-panel name="signal-chain">
        <div id="chain" class="wa-stack wa-align-items-center wa-gap-0"></div>
      </wa-tab-panel>
    </wa-tab-group>
  </wa-page>

  <div class="fab">
  <wa-dropdown id="add-dropdown" placement="top-end" distance="8">
    <wa-button slot="trigger" variant="brand" size="large" pill>
      <wa-icon name="plus"></wa-icon>
    </wa-button>
    <wa-dropdown-item value="equalization">
      <wa-icon slot="icon" name="sliders"></wa-icon>
      Equalization
    </wa-dropdown-item>
    <wa-dropdown-item value="compressor">
      <wa-icon slot="icon" name="compress"></wa-icon>
      Compressor
    </wa-dropdown-item>
    <wa-dropdown-item value="delay">
      <wa-icon slot="icon" name="clock"></wa-icon>
      Delay
    </wa-dropdown-item>
    <wa-dropdown-item value="reverb">
      <wa-icon slot="icon" name="church"></wa-icon>
      Reverb
    </wa-dropdown-item>
    <wa-dropdown-item value="distortion">
      <wa-icon slot="icon" name="bolt"></wa-icon>
      Distortion
    </wa-dropdown-item>
    <wa-dropdown-item value="gate">
      <wa-icon slot="icon" name="door-closed"></wa-icon>
      Noise Gate
    </wa-dropdown-item>
    <wa-dropdown-item value="panner">
      <wa-icon slot="icon" name="arrows-left-right"></wa-icon>
      Stereo Panner
    </wa-dropdown-item>
  </wa-dropdown>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
